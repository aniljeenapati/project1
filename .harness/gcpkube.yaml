service:
  name: aj-serv
  identifier: gcpkube
  orgIdentifier: default
  projectIdentifier: SFTY_Training
  serviceDefinition:
    spec:
      configFiles:
        - configFile:
            identifier: deploy
            spec:
              store:
                type: Github
                spec:
                  connectorRef: ajgit
                  gitFetchType: Branch
                  paths:
                    - project1/deploy.yaml
                  repoName: project1
                  branch: main
    type: Kubernetes
